
name: Build VoxyLite

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Extraer proyecto VoxyLite
        run: |
          mkdir project
          unzip -q VoxyLite-1.21.1-GitHub-Actions.zip -d project

      - name: Encontrar proyecto Gradle
        run: |
          SETTINGS=$(find project -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "No se encontró settings.gradle"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar VoxyLite
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper --gradle-version 8.10.2
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Preparar JAR
        run: |
          mkdir -p artifacts
          find "$PROJECT_DIR/build/libs" -type f -name "*.jar" -not -name "*-sources.jar" -exec cp {} artifacts/ \;
          ls -lah artifacts

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoxyLite-1.21.1-Fabric
          path: artifacts/*.jar
          if-no-files-found: error
